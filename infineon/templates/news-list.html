<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SEO_TITLE}}</title>
  <meta name="description" content="{{SEO_DESCRIPTION}}">
  <meta name="keywords" content="{{SEO_KEYWORDS}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:url" content="{{OG_URL}}">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/css/style.css?v=20261030">
  {{SCHEMA}}
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  {{HEADER}}
  <main id="main">
    <div class="container">
      {{BREADCRUMB}}
      <header class="page-header">
        <h1>{{PAGE_TITLE}}</h1>
        <p>{{PAGE_DESC}}</p>
      </header>
    </div>
    <section class="section">
      <div class="container">
        <div class="section-head"><h2 class="section-title">公司新闻</h2><a class="card-link" href="/news/company/">查看全部公司新闻</a></div>
        <div class="grid grid-3">{{COMPANY_NEWS}}</div>
      </div>
    </section>
    <section class="section section--alt">
      <div class="container">
        <div class="section-head"><h2 class="section-title">行业动态</h2><a class="card-link" href="/news/industry/">查看全部行业动态</a></div>
        <div class="grid grid-3">{{INDUSTRY_NEWS}}</div>
      </div>
    </section>
  </main>
  {{FOOTER}}
  <script src="/assets/js/main.js?v=20261030"></script>
</body>
</html>
