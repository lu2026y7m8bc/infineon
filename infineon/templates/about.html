<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SEO_TITLE}}</title>
  <meta name="description" content="{{SEO_DESCRIPTION}}">
  <meta name="keywords" content="{{SEO_KEYWORDS}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:url" content="{{OG_URL}}">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/css/style.css?v=20261031">
  {{SCHEMA}}
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  {{HEADER}}
  <main id="main">
    <div class="container">
      {{BREADCRUMB}}
      <header class="page-header">
        <h1>{{PAGE_TITLE}}</h1>
        <p>{{PAGE_DESC}}</p>
      </header>

      <section class="section">
        <h2 class="section-title">公司简介</h2>
        <div class="article-content">{{INTRO}}</div>
      </section>

      <section class="section">
        <h2 class="section-title">团队实力</h2>
        <p>{{TEAM_DESC}}</p>
        <div class="stat-grid">{{TEAM_STATS}}</div>
      </section>

      <section class="section section--alt">
        <h2 class="section-title">发展历程</h2>
        <ol class="timeline">{{TIMELINE}}</ol>
      </section>

      <section class="section">
        <h2 class="section-title">资质与报关单</h2>
        <div class="doc-grid">{{CUSTOMS}}</div>
      </section>

      <section class="section section--alt">
        <h2 class="section-title">公司优势</h2>
        <div class="grid grid-4">{{ADVANTAGES}}</div>
      </section>

      <section class="section">
        <h2 class="section-title">服务客户案例</h2>
        <div class="grid grid-3">{{CASES}}</div>
      </section>

      <section class="section">
        <h2 class="section-title">服务区域</h2>
        <p>力通服务覆盖：{{SERVICE_AREAS}}</p>
      </section>

      <section class="section">
        <h2 class="section-title">常见问题</h2>
        <div class="faq-grid">{{FAQ}}</div>
      </section>
    </div>
    {{DETAIL_CTA}}
  </main>
  {{FOOTER}}
  <script src="/assets/js/main.js?v=20261031"></script>
</body>
</html>
