<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SEO_TITLE}}</title>
  <meta name="description" content="{{SEO_DESCRIPTION}}">
  <meta name="keywords" content="{{SEO_KEYWORDS}}">
  <link rel="canonical" href="{{CANONICAL}}">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:url" content="{{OG_URL}}">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/assets/css/style.css?v=20261031">
  {{SCHEMA}}
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  {{HEADER}}
  <main id="main">
    <div class="container">
      {{BREADCRUMB}}
      <header class="page-header">
        <h1>{{PAGE_TITLE}}</h1>
        <p>{{CATEGORY_DESC}}</p>
      </header>

      <div class="layout-sidebar">
        {{SIDEBAR}}
        <div>
          {{GUIDE_LINK}}

          <section class="section">
            {{TABLE}}
          </section>

          {{FAE_REVIEW}}

          <section class="section">
            <h2 class="section-title">应用领域</h2>
            <div class="grid grid-4">{{APPLICATIONS}}</div>
          </section>

          <section class="section">
            <h2 class="section-title">优势对比</h2>
            <div class="grid grid-2">{{ADVANTAGES}}</div>
          </section>

          <section class="section">
            <h2 class="section-title">替代料号 / 配套料号</h2>
            <div class="grid grid-2">
              <div>{{ALTERNATIVES}}</div>
              <div>{{COMPANIONS}}</div>
            </div>
          </section>

          <section class="section">
            <h2 class="section-title">常见问题</h2>
            <div class="faq-grid">{{FAQ}}</div>
          </section>

          <section class="cta-block">{{CATEGORY_CTA}}</section>
        </div>
      </div>
    </div>
  </main>
  {{FOOTER}}
  <script src="/assets/js/main.js?v=20261031"></script>
</body>
</html>
